name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          lint: false
          test: false
      - name: Lint
        run: lake lint -- --no-build BakerHeegnerStark
      - name: Audit axioms
        run: lake env lean scripts/check_axioms.lean
